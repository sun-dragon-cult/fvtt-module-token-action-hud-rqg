name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Fill in version and links in module.json
        run: |
          sed -i "s|#{VERSION}#|${TAG#v}|" dist/module.json
          sed -i "s|#{URL}#|${REPO_URL}|" dist/module.json
          sed -i "s|#{MANIFEST}#|${REPO_URL}/releases/latest/download/module.json|" dist/module.json
          sed -i "s|#{DOWNLOAD}#|${REPO_URL}/releases/download/${TAG}/module.zip|" dist/module.json

      - name: Zip the module
        run: cd dist && zip -r ../module.zip . -x "*.map"

      - name: Attach module.json and module.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/module.json module.zip --clobber
